#
# First report in the project. Deliberately almost empty: it records a device
# that exists and is reachable, and claims nothing about what works, because
# nothing has been installed or run against it yet.
#
# This is what an honest untested report looks like. Absent results mean
# untested — see docs/conventions.md.
#

schema = 1

[reporter]
handle = "haripako"
date = "2026-08-15"

[device]
kind = "phone"
vendor = "Google"
model = "Pixel 7 Pro"
os = "Android 17"

[host]
distro = "Arch Linux"
desktop = "Omarchy 4 (edge) / Hyprland"
kernel = "7.1.8-arch1-3"
bluez = "5.87"
bt_adapter = "MediaTek MT7922 (usb 0e8d:0608)"

# No [[result]] blocks yet: none of the tooling is installed on this host.
# Measured on 2026-08-15, for the record:
#   - Present over USB, first as 18d1:4ee7 (charging + adb, no MTP), then as
#     18d1:4ee2 (MTP + adb) after the USB mode was changed on the phone. USB
#     debugging is enabled, so adb will work over cable once android-tools is in.
#   - Not paired over Bluetooth. The host has zero Google devices paired.
#   - LAN subnet not yet confirmed against the host's 192.168.10.0/24, which is
#     the hard requirement for anything Quick Share.
