name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. This workflow only reads the tree; nothing here needs to
# write to the repository, and pull requests from strangers must not be able to.
permissions:
  contents: read

jobs:
  data:
    name: Reports and matrix
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. Tags are mutable: whoever
      # controls the action repository can repoint a version tag at different
      # code, and this workflow runs on every pull request from strangers.
      # Dependabot keeps these current; see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Validates every data/devices/*.toml against data/capabilities.toml and
      # fails if the generated matrix was not regenerated after a data change.
      - name: Validate device reports and check the matrix is current
        run: scripts/build-matrix.py --check

      # The suite. Standard library only: nothing to install, no network, and
      # nothing that starts a binary which talks to hardware. Two of its tests
      # assert what was NOT executed, by replacing PATH with recording stubs —
      # that is what keeps a status command from ever being the thing that
      # crashes somebody's Bluetooth.
      - name: Tests
        run: python3 -m unittest discover -t . -s tests -v
        env:
          LC_ALL: C

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax
        run: bash -n scripts/hw-report.sh

      # Warning level and above. The reference machine has no shellcheck, so
      # style findings would otherwise fail builds nobody can reproduce locally.
      - name: shellcheck
        run: shellcheck --severity=warning scripts/hw-report.sh

      # The scripts must never install anything: they print the command and stop.
      # This is a contract with contributors, so it gets enforced rather than
      # documented and forgotten.
      - name: No script installs packages
        run: |
          if grep -nE '^[^#]*\b(sudo +pacman|yay|pacman +-S|apt(-get)? +install)\b' scripts/*.sh \
             | grep -vE 'echo|printf'; then
            echo "A script appears to run a package manager. Print the command instead." >&2
            exit 1
          fi
          echo "ok: no script runs a package manager"

      # The MAC-address and host-IP invariant used to live here as a grep. It
      # now lives in tests/test_repo_invariants.py, which is strictly better:
      # it has positive controls proving the detector catches a report that
      # does leak, including subnet = "[ip redacted]/24" — a host address that
      # the old grep accepted because it only looked at the /NN suffix.
      #
      # Deliberately not kept in both places. One invariant implemented twice
      # with different criteria is worse than one implemented once, because the
      # weaker copy quietly defines the real standard.
